  /api/v1/folders/import:
    post:
      description: Multipart file field; .json filename required; file limit 10 MiB and at most 5000 items. Validation does not save data. See docs/folder-import.md for the import envelope.
      operationId: importFolder
      requestBody:
        content:
          multipart/form-data:
            schema:
              properties:
                file:
                  format: binary
                  type: string
              required:
              - file
              type: object
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportResult"

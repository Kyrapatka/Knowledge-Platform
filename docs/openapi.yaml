components:
  responses:
    BadRequest:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
      description: Malformed JSON, invalid UUID/query, validation failure or bounded request body exceeded while decoding. See error and optional message/validation.
    Conflict:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
      description: Nickname exists, optimistic version changed, incompatible session state or an active mock interview already exists.
    Forbidden:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
      description: Blocked account or invalid browser Origin.
    InternalError:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
      description: Unexpected server error; internal details are logged server-side only.
    NotFound:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
      description: Requested owned resource or active mock session was not found.
    RateLimited:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
      description: Process-local authentication rate limit exceeded. Retry after the indicated number of seconds.
      headers:
        Retry-After:
          description: Seconds until retry
          schema:
            type: integer
    TooLarge:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
      description: Request or import file exceeds its size limit.
    Unauthorized:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
      description: Missing/expired bearer or refresh credential. Ownership is checked server-side.
  schemas:
    AuthAuthResponse:
      properties:
        access_token:
          type: string
        expires_at:
          format: date-time
          type: string
        refresh_token:
          type: string
        user:
          $ref: "#/components/schemas/AuthUserResponse"
      required:
      - user
      - access_token
      - refresh_token
      - expires_at
      type: object
    AuthBrowserAuthResponse:

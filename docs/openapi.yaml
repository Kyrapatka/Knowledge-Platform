  securitySchemes:
    bearerAuth:
      bearerFormat: JWT
      scheme: bearer
      type: http
    refreshCookie:
      description: HttpOnly browser refresh cookie; browser endpoints also require matching Origin.
      in: cookie
      name: kp_refresh
      type: apiKey
info:
  description: HTTP contract for the current application. All application routes are under /api/v1. Use token login and Authorize with the returned access_token for Swagger requests; browser authentication additionally uses exact Origin checks and HttpOnly refresh cookies. Owned resources are never selected by an owner ID supplied by the client. Ordinary JSON is capped at 1 MiB, authentication at 64 KiB, training at 1 MiB and interview JSON at 2 MiB; folder imports have a separate 10 MiB file limit. Handler-bound oversized bodies may return 400, while declared ordinary oversized requests return 413. Examples are illustrative; IDs and versions must come from real responses.
  title: Knowledge Platform API
  version: 1.0.0
openapi: 3.0.3
paths:
  /api/v1/auth/browser/login:
    post:
      description: Browser requests require an exact matching Origin (scheme + host). Refresh credentials are stored in the HttpOnly SameSite kp_refresh cookie scoped to /api/v1/auth/browser; Secure on HTTPS. Access tokens are returned in JSON. Swagger sends same-origin requests; JavaScript cannot manually set HttpOnly cookies.
      operationId: browserLogin
      parameters:
      - description: Must match the request origin or configured public origin. Set automatically by the browser on same-origin POST.
        in: header
        name: Origin
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthLoginRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthBrowserAuthResponse"
          description: Success
          headers:
            Set-Cookie:
              description: Sets/rotates or expires kp_refresh. Managed by the browser.
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/TooLarge"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
      security: []
      summary: Browser login
      tags:
      - Authentication
  /api/v1/auth/browser/logout:
    post:
      description: Browser requests require an exact matching Origin (scheme + host). Refresh credentials are stored in the HttpOnly SameSite kp_refresh cookie scoped to /api/v1/auth/browser; Secure on HTTPS. Access tokens are returned in JSON. Swagger sends same-origin requests; JavaScript cannot manually set HttpOnly cookies.
      operationId: browserLogout
      parameters:
      - description: Must match the request origin or configured public origin. Set automatically by the browser on same-origin POST.
        in: header
        name: Origin
        required: true
        schema:
          type: string
      responses:
        "204":
          description: No content
          headers:
            Set-Cookie:
              description: Sets/rotates or expires kp_refresh. Managed by the browser.
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/TooLarge"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
      security:
      - refreshCookie: []
      summary: Browser logout
      tags:
      - Authentication
  /api/v1/auth/browser/refresh:
    post:
      description: Browser requests require an exact matching Origin (scheme + host). Refresh credentials are stored in the HttpOnly SameSite kp_refresh cookie scoped to /api/v1/auth/browser; Secure on HTTPS. Access tokens are returned in JSON. Swagger sends same-origin requests; JavaScript cannot manually set HttpOnly cookies.
      operationId: browserRefresh
      parameters:
      - description: Must match the request origin or configured public origin. Set automatically by the browser on same-origin POST.
        in: header
        name: Origin
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthBrowserAuthResponse"
          description: Success
          headers:
            Set-Cookie:
              description: Sets/rotates or expires kp_refresh. Managed by the browser.
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/TooLarge"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
      security:
      - refreshCookie: []
      summary: Browser refresh
      tags:
      - Authentication
  /api/v1/auth/browser/register:
    post:
      description: Browser requests require an exact matching Origin (scheme + host). Refresh credentials are stored in the HttpOnly SameSite kp_refresh cookie scoped to /api/v1/auth/browser; Secure on HTTPS. Access tokens are returned in JSON. Swagger sends same-origin requests; JavaScript cannot manually set HttpOnly cookies.
      operationId: browserRegister
      parameters:
      - description: Must match the request origin or configured public origin. Set automatically by the browser on same-origin POST.
        in: header
        name: Origin
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthRegisterRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthBrowserAuthResponse"
          description: Created
          headers:
            Set-Cookie:
              description: Sets/rotates or expires kp_refresh. Managed by the browser.
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/TooLarge"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
      security: []
      summary: Browser register
      tags:
      - Authentication
  /api/v1/auth/login:
    post:
      description: Non-browser token API. Keep refresh_token private. Authentication bodies are limited to 64 KiB.
      operationId: tokenLogin
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthLoginRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthAuthResponse"
          description: Success
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/TooLarge"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
      security: []
      summary: Token login
      tags:
      - Authentication
  /api/v1/auth/logout:
    post:
      description: Non-browser token API. Keep refresh_token private. Authentication bodies are limited to 64 KiB.
      operationId: tokenLogout
      requestBody:
        content:
          application/json:
            schema:

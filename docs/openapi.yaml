      - access_token
      - expires_at
      type: object
    AuthLoginRequest:
      properties:
        nickname:
          maxLength: 16.0
          minLength: 3.0
          type: string
        password:
          format: password
          maxLength: 128.0
          minLength: 8.0
          type: string
      required:
      - nickname
      - password
      type: object
    AuthLogoutRequest:
      properties:

name: knowledge-platform
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: knowledge_platform
      POSTGRES_USER: knowledge
      POSTGRES_PASSWORD: ${KP_POSTGRES_PASSWORD:-local-postgres-only}
    ports: ["127.0.0.1:${KP_POSTGRES_PORT:-55432}:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knowledge -d knowledge_platform"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  backend:
    build: .
    environment:
      DATABASE_URL: postgres://knowledge:${KP_POSTGRES_PASSWORD:-local-postgres-only}@postgres:5432/knowledge_platform?sslmode=disable
      JWT_SECRET: ${KP_JWT_SECRET:-local-compose-only-change-before-deployment-32chars}
      HTTP_ADDRESS: :8080
      HTTP_SHUTDOWN_TIMEOUT: 15s
      HTTP_SLOW_REQUEST_THRESHOLD: ${HTTP_SLOW_REQUEST_THRESHOLD:-1s}
      HTTP_TRUSTED_PROXIES: ${HTTP_TRUSTED_PROXIES:-}
      AUTH_LOGIN_LIMIT: ${AUTH_LOGIN_LIMIT:-10}
      AUTH_REGISTER_LIMIT: ${AUTH_REGISTER_LIMIT:-5}
      AUTH_REFRESH_LIMIT: ${AUTH_REFRESH_LIMIT:-60}
      AUTH_RATE_WINDOW: ${AUTH_RATE_WINDOW:-1m}
      AUTH_RATE_MAX_KEYS: ${AUTH_RATE_MAX_KEYS:-10000}
      GIN_MODE: release
      LOG_FORMAT: json
      APP_VERSION: ${APP_VERSION:-compose-dev}
      # Separate Compose key: the host .env may deliberately disable analytics.
      ANALYTICS_ENABLED: ${KP_ANALYTICS_ENABLED:-true}
      CLICKHOUSE_ADDR: http://clickhouse:8123
      CLICKHOUSE_DATABASE: knowledge_analytics
      CLICKHOUSE_USER: analytics_writer
      CLICKHOUSE_PASSWORD: ${KP_CLICKHOUSE_WRITER_PASSWORD:-local-writer-only}
      ANALYTICS_FLUSH_INTERVAL: 5s
    ports: ["127.0.0.1:${KP_BACKEND_PORT:-8080}:8080"]
    depends_on:
      postgres: {condition: service_healthy}
    # ClickHouse is deliberately NOT a startup/readiness dependency.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/ready"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s
    stop_grace_period: 35s
    restart: unless-stopped
  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    environment:
      CLICKHOUSE_USER: analytics_admin
      CLICKHOUSE_PASSWORD: ${KP_CLICKHOUSE_ADMIN_PASSWORD:-local-clickhouse-admin-only}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports: ["127.0.0.1:${KP_CLICKHOUSE_PORT:-8123}:8123"]
    volumes: ["clickhouse-data:/var/lib/clickhouse"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 30
    ulimits:
      nofile: {soft: 262144, hard: 262144}
    restart: unless-stopped
  clickhouse-init:
    image: clickhouse/clickhouse-server:25.8
    entrypoint: ["/bin/bash", "/schema/init.sh"]
    environment:
      CLICKHOUSE_PASSWORD: ${KP_CLICKHOUSE_ADMIN_PASSWORD:-local-clickhouse-admin-only}
      WRITER_PASSWORD: ${KP_CLICKHOUSE_WRITER_PASSWORD:-local-writer-only}
      READER_PASSWORD: ${KP_CLICKHOUSE_READER_PASSWORD:-local-reader-only}
    volumes: ["./deploy/clickhouse:/schema:ro"]
    depends_on:
      clickhouse: {condition: service_healthy}
    restart: "no"
  prometheus:
    image: prom/prometheus:v3.14.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus", "--storage.tsdb.retention.time=30d"]
    ports: ["127.0.0.1:${KP_PROMETHEUS_PORT:-9090}:9090"]
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    restart: unless-stopped
  grafana:
    image: grafana/grafana:13.2.2
    environment:
      GF_SECURITY_ADMIN_USER: ${KP_GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${KP_GRAFANA_PASSWORD:-local-grafana-only}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_PLUGINS_PREINSTALL_SYNC: grafana-clickhouse-datasource@4.20.0
      CLICKHOUSE_READER_PASSWORD: ${KP_CLICKHOUSE_READER_PASSWORD:-local-reader-only}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/system.json
    ports: ["127.0.0.1:${KP_GRAFANA_PORT:-3000}:3000"]
    volumes:
      - grafana-data:/var/lib/grafana
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    restart: unless-stopped
volumes:
  postgres-data:
  clickhouse-data:
  prometheus-data:
  grafana-data:
